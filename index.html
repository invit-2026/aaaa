<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mane & Amelie Celebration</title>

<style>
:root {
  --pink: #FFD1DC;
  --pink-light: #FFE4EC;
  --silver: #C8C3C6;
  --champagne: #F7E7CE;
  --white: #ffffff;
}

/* PAGE */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, var(--pink), var(--pink-light));
  color: var(--silver);
  text-align: center;
}

/* HERO */
.hero {
  padding: 80px 20px;
}

h1 {
  font-size: 42px;
  background: linear-gradient(90deg, #C8C3C6, #F7E7CE, #ffffff, #C8C3C6);
  background-size: 200% auto;
  color: transparent;
  -webkit-background-clip: text;
  animation: shine 4s linear infinite;
}

@keyframes shine {
  0% { background-position: 0%; }
  100% { background-position: 200%; }
}

/* IMAGE */
.photo {
  width: 240px;
  height: 240px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid #F7E7CE;
  box-shadow: 0 0 25px rgba(255, 209, 220, 0.6);
  margin-top: 20px;
  transition: transform 0.4s ease;
}

.photo:hover {
  transform: scale(1.05);
}

/* CARD */
.card {
  background: rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(10px);
  display: inline-block;
  padding: 20px;
  margin-top: 30px;
  border-radius: 20px;
  border: 1px solid #C8C3C6;
}

/* FOOTER */
footer {
  margin-top: 60px;
  padding: 20px;
  color: #C8C3C6;
}
</style>
</head>

<body>

<div class="hero">

  <h1>Mane's 30th Birthday & Amelie's First Tooth</h1>

  <!-- 💖 YOUR IMAGE GOES HERE -->
  <img src="Amelie.jpg" alt="Amelie" class="photo">

  <div class="card">
    <h2>Florence Restaurant</h2>
    <p>20 June 2026 • 19:00</p>
  </div>

</div>

<footer>
We look forward to celebrating this beautiful moment with you.
</footer>

</body>
</html>
